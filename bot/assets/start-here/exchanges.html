<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Sora;src:url(node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Sora;src:url(node_modules/@fontsource/sora/files/sora-latin-600-normal.woff2) format("woff2");font-weight:600}
/* Exchange strip for the server guide: Discord can't colour link buttons, so the colour lives in the picture above them. */
body{margin:0;width:1200px;height:260px;background:#050d14;font-family:Sora,"Noto Sans","PingFang SC","Hiragino Sans","Apple SD Gothic Neo",sans-serif;color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;inset:-40% -10% auto -10%;height:160%;background:radial-gradient(45% 55% at 50% 35%,rgba(34,211,238,.18),transparent 70%)}
.line{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#22d3ee,#10b981 55%,transparent)}
.row{position:absolute;inset:0 48px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.tile{flex:1;height:176px;border-radius:22px;background:linear-gradient(160deg,rgba(34,211,238,.14),rgba(16,185,129,.08));border:2px solid rgba(34,211,238,.45);box-shadow:0 0 28px rgba(34,211,238,.18) inset,0 0 22px rgba(16,185,129,.12);display:flex;align-items:center;gap:22px;padding:0 28px;box-sizing:border-box}
.tile img{width:88px;height:88px;border-radius:20px}
.name{font-weight:800;font-size:40px;letter-spacing:-.02em}
.tag{font-weight:600;font-size:19px;color:#10b981;margin-top:6px}
</style>
<div class="glow"></div>
<div class="row">
  <div class="tile"><img src="exchanges/bitget.png"><div><div class="name">Bitget</div><div class="tag" id="t3"></div></div></div>
  <div class="tile"><img src="exchanges/blofin.png"><div><div class="name">Blofin</div><div class="tag" id="t2"></div></div></div>
  <div class="tile"><img src="exchanges/bybit.png"><div><div class="name">Bybit</div><div class="tag" id="t1"></div></div></div>
</div>
<div class="line"></div>
